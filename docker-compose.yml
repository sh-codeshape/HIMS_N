services:
  postgres:
    image: postgres:16-alpine
    container_name: hims-postgres
    ports:
      - "5433:5432"                   # 5433 on host (docbot uses 5432)
    environment:
      POSTGRES_USER: ${DB_USER:-hims}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hims}
      POSTGRES_DB: ${DB_NAME:-hims_db}
    volumes:
      - hims-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-hims} -d ${DB_NAME:-hims_db}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  dbmate:
    image: amacneil/dbmate:latest
    container_name: hims-dbmate
    command: ["up"]
    environment:
      DATABASE_URL: postgres://${DB_USER:-hims}:${DB_PASSWORD:-hims}@postgres:5432/${DB_NAME:-hims_db}?sslmode=disable
    volumes:
      - ./backend/src/db/migrations:/db/migrations
    depends_on:
      postgres:
        condition: service_healthy

  pgbackups:
    image: prodrigestivill/postgres-backup-local
    container_name: hims-pgbackups
    restart: always
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${DB_NAME:-hims_db}
      - POSTGRES_USER=${DB_USER:-hims}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-hims}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ${DOCKERHUB_USERNAME:-local}/hims-n-api:latest
    container_name: hims-api
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3000"                   # 3001 on host (docbot uses 3000)
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${DB_USER:-hims}:${DB_PASSWORD:-hims}@postgres:5432/${DB_NAME:-hims_db}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      CORS_ORIGIN: ${CORS_ORIGIN}
    deploy:
      resources:
        limits:
          memory: 256M
    depends_on:
      postgres:
        condition: service_healthy
      dbmate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 15s

volumes:
  hims-postgres-data:
