version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: hims_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: hims_db
    ports:
      - "5433:5432"
    volumes:
      - hims_pg_data:/var/lib/postgresql/data

volumes:
  hims_pg_data:
